<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Battery Monitor</title>
    <style>
        .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin:12px 0}.big{font-size:34px;color:var(--accent);font-weight:bold}.bad{color:var(--danger)}.warn{color:#ffb000}.small{font-size:12px;opacity:.7}.barbox{height:22px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#111}.bar{height:100%;background:var(--accent);width:0}.chart{height:120px;display:flex;align-items:end;gap:2px;border-bottom:1px solid #333}.vbar{flex:1;background:var(--accent);min-width:2px;opacity:.85}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #222}
    </style>
</head>
<body>
<div class="container">
    <a href="/" style="color:var(--accent)">← Назад</a>
    <h2>Battery / BMS Monitor</h2>
    <div class="panel">
        <div id="pct" class="big">--%</div>
        <div class="barbox"><div id="bar" class="bar"></div></div>
        <p id="summary" class="small">Waiting for ADC...</p>
    </div>
    <div class="panel">
        <table>
            <tr><td>Voltage</td><td id="voltage">-</td></tr>
            <tr><td>Status</td><td id="status">-</td></tr>
            <tr><td>Trend</td><td id="trend">-</td></tr>
            <tr><td>Session min/max</td><td id="minmax">-</td></tr>
            <tr><td>Updated</td><td id="updated">-</td></tr>
        </table>
    </div>
    <div class="panel"><h3>Voltage history</h3><div id="chart" class="chart"></div><p class="small">Stored on Node A RAM, up to configured history depth.</p></div>
</div>
<script>
function by(id){return document.getElementById(id)}
async function poll(){try{const r=await fetch('/api/battery/status');render(await r.json())}catch(e){by('summary').textContent='API error: '+e}setTimeout(poll,5000)}
function render(d){
    if(!d.ok){by('summary').textContent='Battery monitor unavailable: '+(d.error||'unknown');return}
    const pct=Math.max(0,Math.min(100,d.percent||0));
    by('pct').textContent=pct+'%'; by('bar').style.width=pct+'%';
    by('pct').className='big '+(d.status==='CRITICAL'?'bad':d.status==='LOW'?'warn':'');
    by('voltage').textContent=(d.voltage||0).toFixed(2)+' V'; by('status').textContent=d.status||'-'; by('trend').textContent=d.trend||'-';
    by('minmax').textContent=((d.min_mv||0)/1000).toFixed(2)+' / '+((d.max_mv||0)/1000).toFixed(2)+' V'; by('updated').textContent=d.updated_ms||'-';
    by('summary').textContent=(d.status||'-')+' • '+(d.trend||'-')+' • '+(d.voltage||0).toFixed(2)+' V';
    const s=(d.samples||[]).slice(-80), min=Math.min(...s.map(x=>x[1]),3300), max=Math.max(...s.map(x=>x[1]),4200);
    by('chart').innerHTML=s.map(x=>`<div class="vbar" title="${(x[1]/1000).toFixed(2)}V" style="height:${Math.max(2,Math.min(118,((x[1]-min)*116/Math.max(1,max-min))+2))}px"></div>`).join('');
}
poll();
</script>
</body>
</html>
