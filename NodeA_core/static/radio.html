<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colibry · Radio</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .status-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .pill { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    .pill b { color: var(--accent); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; vertical-align: middle; }
    .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot.warn { background: #ffaa00; }
    .dot.err { background: var(--danger); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 13px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
    .row button { min-width: 120px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: #1a1a1a; color: #999; cursor: pointer; font-size: 13px; }
    .tab.active { border-color: var(--accent); color: var(--accent); }
    .mod { display: none; }
    .mod.active { display: block; }
    .log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 160px; overflow-y: auto; background: #0a0a0a; border: 1px solid #222; border-radius: 6px; padding: 8px; white-space: pre-wrap; margin-top: 10px; }
    .hint { font-size: 12px; opacity: 0.55; margin: 6px 0 0; }
    select { background: #111; color: var(--text); border: 1px solid #333; border-radius: 4px; padding: 6px; }
    .truth { font-size: 11px; opacity: 0.45; margin-top: 4px; }
  </style>
</head>
<body>
<div class="container">
  <div class="nav-header">
    <a href="/"><button type="button">← Home</button></a>
    <h1 style="margin:0;font-size:18px;">Radio</h1>
  </div>
  <div class="status-bar">
    <div class="pill"><span class="dot" id="dLink"></span>Link<br><b id="sLink">—</b></div>
    <div class="pill"><span class="dot" id="dB"></span>Node B<br><b id="sB">—</b><div class="truth" id="tB">Q2=?</div></div>
    <div class="pill"><span class="dot" id="dRail"></span>RF rail (Q3)<br><b id="sRail">—</b><div class="truth" id="tRail">Q3=?</div></div>
    <div class="pill"><span class="dot" id="dMod"></span>Active module<br><b id="sMod">none</b><div class="truth" id="tMod">state=—</div></div>
  </div>
  <div class="panel">
    <h2>1 · Node B (Q2 + link)</h2>
    <div class="row">
      <button type="button" id="btnBOn">Node B ON</button>
      <button type="button" id="btnBOff" class="btn-danger">Node B OFF</button>
    </div>
    <p class="hint">ON: Q2↑ → BOOT_OK/keepalive. «power / no link» если Q2=1, а B молчит.</p>
  </div>
  <div class="panel">
    <h2>2 · Modules (exclusive · shared Q3)</h2>
    <div class="tabs">
      <button type="button" class="tab active" data-mod="subghz">Sub-GHz CC1101</button>
      <button type="button" class="tab" data-mod="nrf">NRF24</button>
      <button type="button" class="tab" data-mod="wifi">WiFi audit</button>
      <button type="button" class="tab" data-mod="ble">BLE</button>
    </div>
    <div class="mod active" id="mod-subghz">
      <div class="row">
        <button type="button" id="btnSubOn">CC1101 ON</button>
        <button type="button" id="btnSubOff" class="btn-danger">CC1101 OFF</button>
      </div>
      <div class="row">
        <select id="freq">
          <option value="315000">315.000</option>
          <option value="433920" selected>433.920</option>
          <option value="868350">868.350</option>
          <option value="915000">915.000</option>
        </select>
        <button type="button" id="btnScan">Scan</button>
        <button type="button" id="btnSniff">Sniff</button>
        <button type="button" id="btnRssi">RSSI once</button>
        <button type="button" id="btnSubStop">Stop mode</button>
      </div>
      <p class="hint">ON = B online → Q3↑ → arm module. Scan stream — после SPI driver.</p>
      <div class="log" id="log-subghz">Sub-GHz…</div>
    </div>
    <div class="mod" id="mod-nrf">
      <div class="row">
        <button type="button" id="btnNrfOn">NRF ON</button>
        <button type="button" id="btnNrfOff" class="btn-danger">NRF OFF</button>
        <button type="button" id="btnNrfHid">HID sniff</button>
        <button type="button" id="btnNrfHoney">Honeypot</button>
      </div>
      <div class="log" id="log-nrf">NRF…</div>
    </div>
    <div class="mod" id="mod-wifi">
      <div class="row">
        <button type="button" id="btnWifiOn">WiFi-aud ON</button>
        <button type="button" id="btnWifiOff" class="btn-danger">WiFi-aud OFF</button>
        <button type="button" id="btnWifiScan">Scan AP</button>
      </div>
      <div class="log" id="log-wifi">WiFi…</div>
    </div>
    <div class="mod" id="mod-ble">
      <div class="row">
        <button type="button" id="btnBleOn">BLE ON</button>
        <button type="button" id="btnBleOff" class="btn-danger">BLE OFF</button>
        <button type="button" id="btnBleScan">Scan ADV</button>
      </div>
      <div class="log" id="log-ble">BLE…</div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
function setDot(id, m) {
  $(id).className = 'dot' + (m === 'on' ? ' on' : m === 'warn' ? ' warn' : m === 'err' ? ' err' : '');
}
async function api(path, method, body) {
  const o = { method: method || 'GET' };
  if (body) { o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(body); }
  return (await fetch('/api/' + path, o)).json();
}
function log(mod, line) {
  const el = $('log-' + mod);
  if (!el) return;
  const t = new Date().toISOString().slice(11, 19);
  el.textContent = '[' + t + '] ' + line + '\n' + (el.textContent || '').slice(0, 1000);
}
function apply(s) {
  if (!s) return;
  const L = s.link || {}, P = s.power || {}, M = s.module || {};
  $('sLink').textContent = L.online ? 'online' : (L.pending ? 'waiting' : 'offline');
  setDot('dLink', L.online ? 'on' : L.pending ? 'warn' : '');
  $('sB').textContent = P.node_b_online ? 'online' : (P.powered || P.q2 ? 'powered' : 'off');
  setDot('dB', P.node_b_online ? 'on' : (P.powered || P.q2) ? 'warn' : '');
  $('tB').textContent = 'Q2=' + !!(P.powered || P.q2) + (P.last_error ? ' ' + P.last_error : '');
  $('sRail').textContent = P.rf_online ? 'on' : (P.q3 ? 'power / no link' : 'off');
  setDot('dRail', P.rf_online ? 'on' : P.q3 ? 'warn' : '');
  $('tRail').textContent = 'Q3=' + !!P.q3;
  $('sMod').textContent = M.name || 'none';
  setDot('dMod', M.active ? 'on' : '');
  $('tMod').textContent = 'state=' + (M.state || '—') + ' letter=' + (M.letter || '.');
  if (s.telemetry && s.telemetry.last_rssi != null)
    log('subghz', 'RSSI ' + s.telemetry.freq_khz + ' → ' + s.telemetry.last_rssi + ' dBm');
  if (s.telemetry && s.telemetry.events) {
    s.telemetry.events.slice(-3).forEach((e) => log(M.name || 'subghz', e.k + ' a=' + e.a + ' b=' + e.b + ' ' + (e.hex || '')));
  }
}
async function refresh() {
  try {
    const s = await api('radio/status');
    if (s && (s.ok !== false || s.power)) apply(s);
  } catch (e) {
    /* transient HTTP/WiFi — не красим всё в err навсегда */
  }
}
async function cmd(action, module, extra) {
  const body = Object.assign({ action: action, module: module || 'subghz' }, extra || {});
  if ($('freq')) body.freq_khz = parseInt($('freq').value, 10);
  try {
    const s = await api('radio/cmd', 'POST', body);
    if (s) apply(s);
    log(module || 'subghz', action + (s && s.error ? ' ERR ' + s.error : ' ok'));
  } catch (e) { log(module || 'subghz', 'ERR ' + e); }
}
$('btnBOn').onclick = () => cmd('node_b_on', 'subghz');
$('btnBOff').onclick = () => cmd('node_b_off', 'subghz');
$('btnSubOn').onclick = () => cmd('module_on', 'subghz');
$('btnSubOff').onclick = () => cmd('module_off', 'subghz');
$('btnNrfOn').onclick = () => cmd('module_on', 'nrf');
$('btnNrfOff').onclick = () => cmd('module_off', 'nrf');
$('btnNrfHid').onclick = () => cmd('hid_sniff', 'nrf');
$('btnNrfHoney').onclick = () => cmd('honeypot', 'nrf');
$('btnWifiOn').onclick = () => cmd('module_on', 'wifi');
$('btnWifiOff').onclick = () => cmd('module_off', 'wifi');
$('btnWifiScan').onclick = () => cmd('wifi_scan', 'wifi');
$('btnBleOn').onclick = () => cmd('module_on', 'ble');
$('btnBleOff').onclick = () => cmd('module_off', 'ble');
$('btnBleScan').onclick = () => cmd('ble_scan', 'ble');
$('btnScan').onclick = () => cmd('scan', 'subghz');
$('btnSniff').onclick = () => cmd('sniff', 'subghz');
$('btnRssi').onclick = () => cmd('rssi_once', 'subghz');
$('btnSubStop').onclick = () => cmd('stop', 'subghz');
document.querySelectorAll('.tab').forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    document.querySelectorAll('.mod').forEach((m) => m.classList.remove('active'));
    tab.classList.add('active');
    const el = $('mod-' + tab.getAttribute('data-mod'));
    if (el) el.classList.add('active');
  };
});
refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
