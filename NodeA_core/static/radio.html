<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Colibry · Sub-GHz</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 10px 12px 48px; }
    h1 { font-size: 1.15rem; margin: 8px 0 12px; }
    .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; margin-bottom: 10px; }
    .bar div { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 6px 8px; }
    .bar b { color: #58a6ff; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    label { font-size: 12px; color: #8b949e; }
    select, input { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
    input[type=number] { width: 96px; }
    .btn { flex: 1 1 30%; min-width: 90px; padding: 12px 8px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-p { background: #238636; color: #fff; }
    .btn-d { background: #1f6feb; color: #fff; }
    .btn-w { background: #9e6a03; color: #fff; }
    .btn-s { background: #6e7681; color: #fff; }
    .btn-r { background: #da3633; color: #fff; }
    .btn:active { opacity: 0.85; }
    canvas { width: 100%; height: 160px; background: #010409; border: 1px solid #30363d; border-radius: 8px; margin: 8px 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px; margin-top: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; }
    .hist { max-height: 240px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, monospace; }
    .hist .item { border-bottom: 1px solid #21262d; padding: 8px 2px; cursor: pointer; }
    .hist .item:hover, .hist .item.sel { background: #21262d; }
    .hist .meta { color: #8b949e; }
    .hist .key { color: #3fb950; word-break: break-all; }
    #log { font-size: 11px; font-family: ui-monospace, monospace; max-height: 100px; overflow-y: auto; color: #8b949e; }
    .live { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h1>Sub-GHz</h1>
    <a href="/">← menu</a>
  </div>

  <div class="bar">
    <div>Link <b id="stLink">—</b></div>
    <div>NodeB <b id="stPow">—</b></div>
    <div>RF <b id="stRf">—</b></div>
    <div>Mode <b id="stMode">—</b></div>
    <div>RSSI <b id="lastRssi">—</b></div>
    <div>Events <b id="evCnt">0</b></div>
  </div>

  <div class="row">
    <button class="btn btn-s" id="btnBon">NodeB ON</button>
    <button class="btn btn-s" id="btnBoff">NodeB OFF</button>
    <button class="btn btn-s" id="btnMod">RF ON</button>
    <button class="btn btn-r" id="btnMoff">RF OFF</button>
  </div>

  <div class="row">
    <label>Band
      <select id="freq">
        <option value="315000">315</option>
        <option value="433920" selected>433.92</option>
        <option value="868350">868.35</option>
        <option value="915000">915</option>
        <option value="wide">Wide 300–928</option>
        <option value="custom">custom</option>
      </select>
    </label>
    <label>kHz <input type="number" id="freqCustom" value="433920" step="1" min="300000" max="928000"></label>
    <label>Preset
      <select id="preset">
        <option value="0">AM650</option>
        <option value="1">AM270</option>
        <option value="3">Wide RX</option>
      </select>
    </label>
    <label>Thr
      <select id="thresh">
        <option value="60">-60</option>
        <option value="72" selected>-72</option>
        <option value="80">-80</option>
        <option value="90">-90</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button class="btn btn-p" id="btnListen">Listen</button>
    <button class="btn btn-d" id="btnScan">Spectrum</button>
    <button class="btn btn-w" id="btnCap">Read once</button>
  </div>
  <div class="row">
    <button class="btn btn-p" id="btnReplaySel">Replay selected</button>
    <button class="btn btn-s" id="btnSave">Save</button>
    <button class="btn btn-r" id="btnStop">Stop</button>
  </div>

  <div class="live">
    <label><input type="checkbox" id="live" checked> Live 1s</label>
    <span id="msg" style="font-size:12px;color:#8b949e"></span>
  </div>
  <canvas id="spec" width="480" height="160"></canvas>
  <div style="font-size:10px;color:#8b949e;margin:-4px 0 8px">Spectrum: Frequency Finder · Listen: RSSI timeline · Thr = detect threshold</div>

  <div class="card" id="candCard">
    <h3>Candidates <span id="candCnt" style="color:#8b949e;font-weight:400"></span></h3>
    <div id="cands" class="hist">Start Spectrum — live frequencies appear here. Tap → Listen</div>
  </div>

  <div class="card">
    <h3>Last signal</h3>
    <div id="lastBox" class="hist">— idle —</div>
  </div>

  <div class="card">
    <h3>History <button class="btn btn-s" id="btnHistClr" style="flex:none;min-width:auto;padding:4px 10px;font-size:11px">clear</button></h3>
    <div id="hist" class="hist">empty</div>
  </div>

  <div class="card">
    <h3>Log</h3>
    <div id="log"></div>
  </div>
</div>
<script src="/js/radio_bin.js"></script>
<script>
const $ = id => document.getElementById(id);
const hist = [];           // capture history (Listen/Capture) — rich log source
let lastKey = "";
let sel = -1;
let specMode = false;
// Frequency Finder: candidates + scan journal (phone-side only)
const candidates = new Map(); // freq_khz_quantized -> {freq, rssi, hits, last_t}
const scanLog = [];           // [{t, freq, rssi}] capped
const SCAN_LOG_MAX = 2000;
let scanBandLabel = "433";

// ——— Spectrum: classic bar analyzer · Listen: RSSI timeline ———
const SPEC_BINS = 48;
const liveBins = new Float32Array(SPEC_BINS);   // current sweep max per bin
const peakHold = new Float32Array(SPEC_BINS);   // session peak per bin
let fMin = 433000, fMax = 434800;
const peakLabels = [];   // {bin, freq, rssi, t} strongest peaks to label
// Listen timeline
const TL_MAX = 120;
const timeline = [];
const tlSpikes = [];
let activeRx = false;    // true only while Listen or Spectrum running
let ignoreHex = new Set(); // hex already in hist / cleared — do not re-add
let lastCaptureKey = "";   // avoid re-pushing same full capture
let lastCapSeq = 0;        // only OP_DUMP when status.capture_seq changes

function rssiColor(r) {
  const t = Math.max(0, Math.min(1, (r + 110) / 90));
  if (t < 0.4) {
    const k = t / 0.4;
    return 'rgb(' + Math.floor(20 + 30 * k) + ',' + Math.floor(100 + 90 * k) + ',' + Math.floor(40 + 20 * k) + ')';
  }
  if (t < 0.65) {
    const k = (t - 0.4) / 0.25;
    return 'rgb(' + Math.floor(50 + 180 * k) + ',' + Math.floor(190 - 50 * k) + ',25)';
  }
  const k = (t - 0.65) / 0.35;
  return 'rgb(' + Math.floor(230 + 25 * k) + ',' + Math.floor(140 - 110 * k) + ',20)';
}

function clearSpec() {
  liveBins.fill(-128);
  peakHold.fill(-128);
  peakLabels.length = 0;
  timeline.length = 0;
  tlSpikes.length = 0;
  drawSpec();
}

function clearScanSession() {
  candidates.clear();
  scanLog.length = 0;
  renderCandidates();
}

function setScanWindow(centerKhz, fullBand) {
  if (fullBand) {
    fMin = 300000;
    fMax = 928000;
  } else {
    const half = 2000;
    fMin = Math.max(300000, (centerKhz || 433920) - half);
    fMax = Math.min(928000, (centerKhz || 433920) + half);
  }
  liveBins.fill(-128);
  peakHold.fill(-128);
  peakLabels.length = 0;
}

function detectThr() {
  return -(parseInt($('thresh').value, 10) || 72);
}

function quantFreq(fk, fullBand) {
  // Wide table: exact kHz key. Band window: 25 kHz merge.
  if (fullBand) return fk | 0;
  return Math.round(fk / 25) * 25;
}

function freqToBin(fk) {
  if (fk < fMin || fk > fMax) return -1;
  return Math.round((fk - fMin) / (fMax - fMin) * (SPEC_BINS - 1));
}

function binToFreq(b) {
  return fMin + (b / (SPEC_BINS - 1)) * (fMax - fMin);
}

/** Ingest RSSI sample batch into spectrum bins / candidates or listen timeline */
function ingestRssiBatch(samples) {
  if (!samples || !samples.length || !activeRx) return;
  if (specMode) {
    const thr = detectThr();
    const fullBand = isWideBand();
    for (let i = 0; i < SPEC_BINS; i++) {
      if (liveBins[i] > -120) liveBins[i] = Math.max(-128, liveBins[i] - 3);
    }
    let candChanged = false;
    for (const s of samples) {
      const fk = s.freq_khz | 0;
      const r = s.rssi;
      if (fk < 300000 || fk > 928000) continue;
      const b = freqToBin(fk);
      if (b >= 0) {
        if (r > liveBins[b]) liveBins[b] = r;
        if (r > peakHold[b]) peakHold[b] = r;
      }
      scanLog.push({ t: Date.now(), freq: fk, rssi: r });
      if (scanLog.length > SCAN_LOG_MAX) scanLog.shift();
      // Candidate = real sample frequency only (never bin-interpolated MHz)
      // Edge 300/310 need 2 hits to reduce spur noise
      const edge = (fk <= 310000 || fk >= 925000);
      if (r >= thr && fk >= 300000 && fk <= 928000) {
        const q = quantFreq(fk, fullBand);
        const prev = candidates.get(q);
        const hits = (prev ? prev.hits : 0) + 1;
        if (edge && hits < 2) {
          candidates.set(q, { freq: fk, rssi: prev && prev.rssi > r ? prev.rssi : r, hits: hits, last_t: Date.now() });
        } else if (!prev || r > prev.rssi) {
          candidates.set(q, { freq: fk, rssi: r, hits: hits, last_t: Date.now() });
          candChanged = true;
        } else {
          prev.hits = hits;
          prev.last_t = Date.now();
          candChanged = true;
        }
      }
    }
    rebuildPeakLabels();
    if (candChanged) renderCandidates();
  } else {
    const last = samples[samples.length - 1];
    if (last && last.rssi != null) {
      timeline.push({ t: Date.now(), rssi: last.rssi });
      if (timeline.length > TL_MAX) timeline.shift();
    }
  }
}

function renderCandidates() {
  const el = $('cands');
  const n = candidates.size;
  $('candCnt').textContent = n ? '(' + n + ')' : '';
  if (!n) {
    el.textContent = activeRx && specMode
      ? 'Scanning… thr ' + detectThr() + ' dBm'
      : 'Start Spectrum — live frequencies appear here. Tap → Listen';
    return;
  }
  const list = Array.from(candidates.values()).sort((a, b) => b.rssi - a.rssi);
  el.innerHTML = list.map((c, i) =>
    '<div class="item" data-freq="' + c.freq + '">' +
    '<div><b style="color:#ff7b72">' + (c.freq / 1000).toFixed(3) + ' MHz</b> · ' +
    c.rssi + ' dBm · hits ' + c.hits + '</div>' +
    '<div class="meta">tap → Listen on this frequency</div></div>'
  ).join('');
  el.querySelectorAll('.item').forEach(node => {
    node.onclick = () => {
      const fk = parseInt(node.getAttribute('data-freq'), 10);
      if (!fk) return;
      listenOnFreq(fk);
    };
  });
}

async function listenOnFreq(fk) {
  // Stop scan and switch to Listen on candidate frequency
  activeRx = false;
  specMode = false;
  $('msg').textContent = 'Listen ' + (fk / 1000).toFixed(3) + ' MHz';
  try {
    await radioCmd(WA.STOP, 'subghz', params());
  } catch (e) { /* ignore */ }
  // set UI frequency to candidate
  const sel = $('freq');
  const opt = Array.from(sel.options).find(o => o.value === String(fk));
  if (opt) sel.value = String(fk);
  else {
    sel.value = 'custom';
    $('freqCustom').value = fk;
  }
  activeRx = true;
  ignoreHex.clear();
  timeline.length = 0;
  tlSpikes.length = 0;
  restartTimer();
  await cmd(WA.LISTEN, { freq_khz: fk });
  log('Listen ← candidate ' + (fk / 1000).toFixed(3) + ' MHz');
  drawSpec();
}

function rebuildPeakLabels() {
  // Labels only from real candidates (sample freq), not bin interpolation
  peakLabels.length = 0;
  const thr = detectThr();
  Array.from(candidates.values()).forEach(c => {
    if (c.rssi < thr) return;
    if (c.freq <= 310000 && c.hits < 2) return;
    const b = freqToBin(c.freq);
    if (b < 0) return;
    peakLabels.push({ bin: b, freq: c.freq, rssi: c.rssi });
  });
  peakLabels.sort((a, b) => b.rssi - a.rssi);
  if (peakLabels.length > 5) peakLabels.length = 5;
}

function addMarker(raw) {
  if (!raw || !raw.hex || !activeRx) return;
  if (specMode) {
    const fk = raw.freq_khz || raw.freq || 0;
    const b = freqToBin(fk);
    if (b >= 0) {
      if (raw.rssi > peakHold[b]) peakHold[b] = raw.rssi;
      if (raw.rssi > liveBins[b]) liveBins[b] = raw.rssi;
      rebuildPeakLabels();
    }
  } else {
    tlSpikes.push({ t: Date.now(), rssi: raw.rssi });
    if (tlSpikes.length > 20) tlSpikes.shift();
  }
}

function drawSpec() {
  const c = $('spec'), ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.fillStyle = '#010409';
  ctx.fillRect(0, 0, W, H);
  if (specMode) drawSpectrumBars(ctx, W, H);
  else drawTimeline(ctx, W, H);
}

function drawSpectrumBars(ctx, W, H) {
  const padL = 4, padR = 4, padT = 18, padB = 18;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const barW = Math.max(2, plotW / SPEC_BINS - 1);

  // grid
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = padT + (plotH * i) / 4;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
  }

  // title + freq axis
  ctx.fillStyle = '#8b949e';
  ctx.font = '9px sans-serif';
  ctx.fillText('SPECTRUM  ' + (fMin / 1000).toFixed(2) + ' — ' + (fMax / 1000).toFixed(2) + ' MHz', padL, 11);
  ctx.fillText('-20', W - 28, padT + 8);
  ctx.fillText('-110', W - 32, H - 4);

  let hasData = false;
  for (let i = 0; i < SPEC_BINS; i++) {
    const x = padL + (i / (SPEC_BINS - 1)) * (plotW - barW);
    // peak hold (dim)
    const pr = peakHold[i];
    if (pr > -120) {
      hasData = true;
      let ph = ((pr + 110) / 90) * plotH;
      if (ph < 1) ph = 1;
      if (ph > plotH) ph = plotH;
      ctx.fillStyle = 'rgba(88,166,255,0.25)';
      ctx.fillRect(x, padT + plotH - ph, barW, ph);
    }
    // live
    const r = liveBins[i];
    if (r > -120) {
      hasData = true;
      let h = ((r + 110) / 90) * plotH;
      if (h < 1) h = 1;
      if (h > plotH) h = plotH;
      ctx.fillStyle = rssiColor(r);
      ctx.fillRect(x, padT + plotH - h, barW, h);
    }
  }

  if (!hasData) {
    ctx.fillStyle = '#484f58';
    ctx.font = '11px sans-serif';
    ctx.fillText(activeRx ? 'Scanning… signal appears as tall colored bars' : 'Start Spectrum', padL + 8, H / 2);
  }

  // frequency labels under strongest peaks
  peakLabels.forEach(p => {
    const x = padL + (p.bin / (SPEC_BINS - 1)) * (plotW - barW) + barW / 2;
    let h = ((p.rssi + 110) / 90) * plotH;
    if (h > plotH) h = plotH;
    const y = padT + plotH - h - 2;
    // marker line
    ctx.strokeStyle = '#ff7b72';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, padT + plotH);
    ctx.lineTo(x, y);
    ctx.stroke();
    // label
    const label = (p.freq / 1000).toFixed(2);
    ctx.fillStyle = '#ff7b72';
    ctx.font = 'bold 10px sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillText(label, Math.max(padL, Math.min(W - padR - tw, x - tw / 2)), Math.max(padT + 10, y - 2));
  });

  // axis ticks
  ctx.fillStyle = '#8b949e';
  ctx.font = '9px sans-serif';
  ctx.fillText((fMin / 1000).toFixed(2), padL, H - 4);
  ctx.fillText((fMax / 1000).toFixed(2), W - 50, H - 4);
  const mid = (fMin + fMax) / 2;
  ctx.fillText((mid / 1000).toFixed(2), W / 2 - 16, H - 4);
}

function drawTimeline(ctx, W, H) {
  ctx.fillStyle = '#8b949e';
  ctx.font = '9px sans-serif';
  ctx.fillText(activeRx ? 'LISTEN · RSSI timeline' : 'IDLE · graph frozen', 4, 12);
  ctx.fillText('-20', W - 28, 20);
  ctx.fillText('-110', W - 32, H - 6);

  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (H * i) / 4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  if (timeline.length < 2) {
    ctx.fillStyle = '#484f58';
    ctx.font = '11px sans-serif';
    ctx.fillText(activeRx ? 'Waiting for RSSI… press remote' : 'Press Listen to start', 8, H / 2);
    return;
  }

  const t0 = timeline[0].t;
  const t1 = timeline[timeline.length - 1].t || (t0 + 1);
  const span = Math.max(t1 - t0, 1);
  function yOf(r) {
    let h = ((r + 110) / 90) * (H - 16);
    if (h < 0) h = 0;
    if (h > H - 8) h = H - 8;
    return H - 4 - h;
  }
  function xOf(t) {
    return 4 + ((t - t0) / span) * (W - 8);
  }

  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  timeline.forEach((p, i) => {
    const x = xOf(p.t), y = yOf(p.rssi);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  tlSpikes.forEach(s => {
    if (s.t < t0) return;
    const x = xOf(s.t), y = yOf(s.rssi);
    ctx.strokeStyle = '#ff7b72';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, H - 4);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = '#ff7b72';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  const last = timeline[timeline.length - 1];
  ctx.fillStyle = '#e6edf3';
  ctx.font = '11px sans-serif';
  ctx.fillText(last.rssi + ' dBm', W - 56, yOf(last.rssi) - 4);
}

// ——— Last / History / Log (phone-side decode) ———
function renderLast(item) {
  const box = $('lastBox');
  if (!item || !item.hex) { box.textContent = '— no signal —'; return; }
  const d = decodeSubghzRaw(item.hex);
  const fk = item.freq || item.freq_khz || 0;
  box.innerHTML =
    '<div><b>' + (fk / 1000).toFixed(3) + ' MHz</b> · ' + item.rssi + ' dBm · ' +
    (item.len || (item.hex.length / 2)) + ' B</div>' +
    '<div class="meta">Protocol: <b style="color:#3fb950">' + d.proto + '</b>' +
    (d.key ? ' · Key: <span class="key">' + d.key + '</span>' : '') + '</div>' +
    '<div class="meta">Bits: ' + d.bits +
    (d.te_us ? ' · TE ' + d.te_us + ' µs' : (d.te ? ' · TE≈' + d.te : '')) +
    (d.symbols ? ' · Symbols: ' + d.symbols : '') + '</div>' +
    '<div class="meta">' + (d.preview || '') + '</div>' +
    '<div class="meta">RAW: ' + item.hex + '</div>';
}

function pushHist(raw) {
  if (!raw || !raw.hex) return;
  if (ignoreHex.has(raw.hex)) return;
  if (!activeRx) return;
  const fk = raw.freq_khz || raw.freq || 0;
  const key = fk + ':' + raw.hex;
  if (key === lastKey || key === lastCaptureKey) return;
  lastKey = key;
  lastCaptureKey = key;
  const d = decodeSubghzRaw(raw.hex);
  const item = {
    t: Date.now(),
    freq: fk,
    rssi: raw.rssi,
    len: raw.len || (raw.hex.length / 2),
    hex: raw.hex,
    nbits: raw.nbits || 0,
    proto: d.proto,
    key: d.key,
    bits: d.bits,
    te: d.te,
    te_us: d.te_us,
    symbols: d.symbols,
    preview: d.preview
  };
  hist.unshift(item);
  if (hist.length > 32) hist.pop();
  sel = 0;
  renderHist();
  renderLast(item);
  addMarker(raw);
  log(d.proto + ' ' + (fk / 1000).toFixed(3) + 'MHz ' + raw.rssi + 'dBm' +
      (d.key ? ' key=' + d.key.slice(0, 16) : ''));
  drawSpec();
}

/** Pull full frame once per capture_seq (NodeB holds → NodeA pipes → phone). */
async function pullFullCapture(seq) {
  if (!activeRx || typeof radioFullCapture !== 'function') return;
  if (seq != null && seq === lastCapSeq) return;
  try {
    const full = await radioFullCapture();
    if (full && full.hex && full.len > 0) {
      if (seq != null) lastCapSeq = seq;
      pushHist(full);
      log('CAP seq=' + seq + ' ' + full.len + 'B rssi=' + full.rssi);
    } else if (seq != null) {
      // Keep lastCapSeq unchanged so next poll retries until data arrives/settles
      log('CAP seq=' + seq + ' empty — retry');
    }
  } catch (e) {
    log('CAP err ' + e);
  }
}

function renderHist() {
  const el = $('hist');
  if (!hist.length) { el.textContent = 'empty'; return; }
  el.innerHTML = hist.map((h, i) =>
    '<div class="item' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
    '<div><b>' + (h.freq / 1000).toFixed(3) + '</b> MHz · ' + h.rssi + ' dBm · ' +
    '<span style="color:#3fb950">' + h.proto + '</span></div>' +
    (h.key ? '<div class="key">' + h.key + '</div>' : '') +
    '<div class="meta">bits:' + h.bits +
    (h.te_us ? ' TE ' + h.te_us + 'µs' : (h.te ? ' TE≈' + h.te : '')) +
    ' · ' + h.hex.slice(0, 36) + (h.hex.length > 36 ? '…' : '') + '</div></div>'
  ).join('');
  el.querySelectorAll('.item').forEach(n => n.onclick = () => {
    sel = parseInt(n.getAttribute('data-i'), 10);
    renderHist();
    renderLast(hist[sel]);
  });
}

/** Unified session log: Spectrum + Capture + Flipper-like durations (phone-side). */
function buildFullSessionLog() {
  const lines = [];
  const list = Array.from(candidates.values()).sort((a, b) => b.rssi - a.rssi);
  const ts = new Date().toISOString();
  lines.push('Filetype: Colibry SubGhz Session');
  lines.push('Version: 3');
  lines.push('Generated: phone-side');
  lines.push('Timestamp: ' + ts);
  lines.push('Band: ' + (scanBandLabel || String(freqKhz())));
  lines.push('Threshold_dBm: ' + detectThr());
  lines.push('Range_kHz: ' + fMin + '..' + fMax);
  lines.push('Sample_us: ' + SUBGHZ_SAMPLE_US);
  lines.push('Candidates: ' + list.length);
  lines.push('Journal_samples: ' + scanLog.length);
  lines.push('Signals: ' + hist.length);
  lines.push('================================');

  // —— Spectrum / Frequency Finder ——
  lines.push('');
  lines.push('## Spectrum');
  lines.push('# Candidates (freq_kHz, peak_rssi, hits)');
  if (list.length) {
    list.forEach((c, i) => {
      lines.push((i + 1) + '\t' + c.freq + '\t' + c.rssi + '\t' + c.hits);
    });
  } else {
    lines.push('(none)');
  }
  lines.push('# Journal (freq_kHz, rssi) newest last, cap 1500');
  if (scanLog.length) {
    const start = Math.max(0, scanLog.length - 1500);
    for (let i = start; i < scanLog.length; i++) {
      const s = scanLog[i];
      lines.push(s.freq + '\t' + s.rssi);
    }
  } else {
    lines.push('(empty)');
  }

  // —— Captures (Listen / Read-once) ——
  lines.push('');
  lines.push('## Captures');
  if (!hist.length) {
    lines.push('(no RAW signals)');
  } else {
    const ordered = hist.slice().reverse();
    ordered.forEach((h, idx) => {
      const d = decodeSubghzRaw(h.hex);
      const durs = hexToDurations(h.hex, SUBGHZ_SAMPLE_US);
      lines.push('');
      lines.push('# Signal ' + (idx + 1));
      lines.push('Protocol: ' + d.proto);
      lines.push('Frequency: ' + h.freq);
      lines.push('RSSI: ' + h.rssi);
      lines.push('Bit_length: ' + d.bits);
      lines.push('Data_size: ' + (h.len || (h.hex.length / 2)));
      if (d.te_us) lines.push('TE_us: ' + d.te_us);
      else if (d.te) lines.push('TE: ' + d.te);
      if (d.symbols) lines.push('Symbols: ' + d.symbols);
      if (d.key) lines.push('Key: ' + d.key);
      if (d.preview) lines.push('Preview: ' + d.preview);
      if (d.note) lines.push('Note: ' + d.note);
      lines.push('Data_RAW: ' + h.hex);
      // Flipper-compatible duration list (µs, +HIGH -LOW)
      if (durs.length) {
        lines.push('Protocol_RAW: RAW');
        lines.push('RAW_Data_count: ' + durs.length);
        formatRawDataLines(durs, 64).forEach(ln => {
          lines.push('RAW_Data: ' + ln);
        });
      } else {
        lines.push('RAW_Data: (no transitions)');
      }
      lines.push('--------------------------------');
    });
  }
  return lines.join('\n');
}

function downloadLog() {
  const hasSpec = candidates.size > 0 || scanLog.length > 0;
  const hasCap = hist.length > 0;
  if (!hasSpec && !hasCap) {
    $('msg').textContent = 'nothing to save';
    return;
  }
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const text = buildFullSessionLog();
  const name = 'colibry_session_' + ts + '.txt';
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  const msg = 'session (' + candidates.size + ' cand, ' + scanLog.length +
    ' journal, ' + hist.length + ' signals)';
  $('msg').textContent = msg;
  log('downloaded ' + msg);
}

function apply(s) {
  if (!s || !s.ok) return;
  const L = s.link || {}, P = s.power || {}, M = s.module || {}, T = s.telemetry || {};
  $('stLink').textContent = L.online ? 'online' : (L.pending ? 'pending' : 'off');
  $('stPow').textContent = P.powered ? 'ON' : 'OFF';
  $('stRf').textContent = (P.rf_on ? (M.letter || 'C') : '·') + ' / ' + (M.name || '—');
  $('stMode').textContent = M.state || '—';
  $('evCnt').textContent = T.event_count != null ? T.event_count : 0;
  if (T.last_rssi != null && activeRx) {
    $('lastRssi').textContent = T.last_rssi + ' dBm';
  }
  // Only ingest live data while Listen/Spectrum active
  if (activeRx) {
    if (T.rssi_samples && T.rssi_samples.length) {
      ingestRssiBatch(T.rssi_samples);
    } else if (T.last_rssi != null && T.freq_khz) {
      ingestRssiBatch([{ freq_khz: T.freq_khz, rssi: T.last_rssi }]);
    }
    // Full RAW only when capture_seq advances (avoids OP_DUMP every poll = lag)
    const cseq = T.capture_seq || 0;
    if (cseq && cseq !== lastCapSeq) {
      pullFullCapture(cseq);
    }
  }
  drawSpec();
}

async function cmd(code, extra) {
  $('msg').textContent = '…';
  try {
    const p = Object.assign(params(), extra || {});
    const s = await radioCmd(code, 'subghz', p);
    apply(s);
    $('msg').textContent = 'ok';
  } catch (e) {
    $('msg').textContent = 'err';
    log(String(e));
  }
}

function isWideBand() {
  return $('freq').value === 'wide';
}
function freqKhz() {
  const v = $('freq').value;
  if (v === 'wide') return 600000; // center placeholder; firmware uses full band when preset=3
  if (v === 'custom') return parseInt($('freqCustom').value, 10) || 433920;
  return parseInt(v, 10) || 433920;
}
function params() {
  // Wide band scan → preset 3 tells firmware full 300–928 range
  const wide = isWideBand();
  return {
    freq_khz: freqKhz(),
    preset: wide ? 3 : (parseInt($('preset').value, 10) || 0),
    thresh: parseInt($('thresh').value, 10) || 72
  };
}
function log(s) {
  const el = $('log');
  el.textContent = (s + '\n' + el.textContent).slice(0, 1600);
}

$('btnBon').onclick = () => cmd(WA.NODE_B_ON);
$('btnBoff').onclick = () => {
  activeRx = false;
  specMode = false;
  clearSpec();
  restartTimer();
  cmd(WA.NODE_B_OFF);
};
$('btnMod').onclick = () => cmd(WA.MOD_ON);
$('btnMoff').onclick = () => {
  activeRx = false;
  specMode = false;
  restartTimer();
  cmd(WA.MOD_OFF);
};
$('btnListen').onclick = () => {
  specMode = false;
  activeRx = true;
  ignoreHex.clear();
  clearSpec();
  restartTimer();
  cmd(WA.LISTEN);
};
$('btnScan').onclick = () => {
  const wide = isWideBand();
  specMode = true;
  activeRx = true;
  ignoreHex.clear();
  clearScanSession();
  setScanWindow(freqKhz(), wide);
  scanBandLabel = wide ? 'wide_300_928' : String(freqKhz());
  clearSpec();
  restartTimer();
  drawSpec();
  renderCandidates();
  log('Spectrum start ' + scanBandLabel + ' thr=' + detectThr() + ' dBm');
  cmd(WA.SCAN);
};
$('btnCap').onclick = async () => {
  // Read once: wait for button press on current Band/Thr; result via full capture
  activeRx = true;
  ignoreHex.clear();
  lastCaptureKey = '';
  lastKey = '';
  specMode = false;
  $('msg').textContent = 'Read once: waiting — press remote';
  log('Read once start thr=' + detectThr() + ' freq=' + freqKhz());
  try {
    const p = Object.assign(params(), {});
    const s = await radioCmd(WA.CAPTURE, 'subghz', p);
    apply(s);
    // apply() already pulls when capture_seq advances; one extra attempt for Read once
    const cseq = (s && s.telemetry && s.telemetry.capture_seq) || 0;
    await pullFullCapture(cseq || null);
    if (hist.length && hist[0]) {
      $('msg').textContent = 'captured';
      log('Read once captured RSSI=' + hist[0].rssi);
    } else {
      $('msg').textContent = 'timeout — no signal';
      log('Read once timeout');
    }
  } catch (e) {
    $('msg').textContent = 'err';
    log(String(e));
  }
};
$('btnReplaySel').onclick = () => {
  if (sel < 0 || !hist[sel]) { $('msg').textContent = 'select signal'; return; }
  const h = hist[sel];
  $('msg').textContent = 'replay sel…';
  cmd(WA.TX_RAW, { freq_khz: h.freq, hex: h.hex });
};
$('btnStop').onclick = () => {
  activeRx = false;
  specMode = false;
  if (hist[0] && hist[0].hex) ignoreHex.add(hist[0].hex);
  lastKey = '';
  lastCaptureKey = '';
  lastCapSeq = 0;
  restartTimer();
  cmd(WA.STOP);
  drawSpec();
};
$('btnSave').onclick = () => {
  downloadLog();
};
$('btnHistClr').onclick = () => {
  hist.forEach(h => { if (h.hex) ignoreHex.add(h.hex); });
  hist.length = 0;
  sel = -1;
  lastKey = '';
  lastCaptureKey = '';
  tlSpikes.length = 0;
  renderHist();
  $('lastBox').textContent = '— idle —';
  drawSpec();
};

let timer = null;
function pollInterval() {
  // Listen needs faster capture_seq pickup after push STREAM
  if (activeRx && specMode) return 400;
  if (activeRx) return 350;
  return 800;
}
function restartTimer() {
  if (timer) clearInterval(timer);
  timer = null;
  if ($('live').checked) timer = setInterval(tick, pollInterval());
}
function tick() {
  if (!$('live').checked) return;
  radioStatus().then(apply).catch(() => {});
}
$('live').onchange = () => restartTimer();
setScanWindow(freqKhz());
drawSpec();
restartTimer();
tick();
</script>
</body>
</html>
